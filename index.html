<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#070a0f"
    >

    <title>MyOS</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ==================================================
         ÉCRAN DE DÉMARRAGE
         ================================================== -->

    <section
        class="boot-screen"
        id="bootScreen"
    >

        <div class="logo">
            MyOS
        </div>


        <h1 class="welcome">
            Bonjour
        </h1>


        <p class="subtitle">
            Bienvenue sur votre système
        </p>


        <button
            class="start-button"
            id="startButton"
            onclick="startMyOS()"
        >
            Démarrer
        </button>


        <div
            class="clock"
            id="clock"
        >
            00:00
        </div>

    </section>



    <!-- ==================================================
         ÉCRAN D'ACCUEIL
         ================================================== -->

    <section
        class="home-screen"
        id="homeScreen"
    >


        <!-- BARRE D'ÉTAT -->

        <header class="status-bar">

            <div id="phoneTime">
                00:00
            </div>


            <div class="status-icons">
                ● ●
            </div>

        </header>



        <!-- WIDGET -->

        <section class="home-widget">

            <div
                class="widget-time"
                id="bigTime"
            >
                00:00
            </div>


            <div class="widget-date">
                Lundi 17 août
            </div>


            <div class="widget-weather">
                23° • Clair
            </div>

        </section>



        <!-- ==================================================
             APPLICATIONS
             ================================================== -->

        <main class="phone-app-grid">


            <!-- CAMÉRA -->

            <button
                class="phone-app"
                onclick="openModule('camera')"
            >

                <span class="app-icon">
                    ◉
                </span>

                <span>
                    Caméra
                </span>

            </button>



            <!-- SÉCURITÉ -->

            <button
                class="phone-app"
                onclick="openModule('security')"
            >

                <span class="app-icon">
                    ◈
                </span>

                <span>
                    Sécurité
                </span>

            </button>



            <!-- MODULES -->

            <button
                class="phone-app"
                onclick="openModule('modules')"
            >

                <span class="app-icon">
                    ⬡
                </span>

                <span>
                    Modules
                </span>

            </button>



            <!-- FICHIERS -->

            <button
                class="phone-app"
                onclick="openModule('files')"
            >

                <span class="app-icon">
                    □
                </span>

                <span>
                    Fichiers
                </span>

            </button>



            <!-- RÉGLAGES -->

            <button
                class="phone-app"
                onclick="openSettings()"
            >

                <span class="app-icon">
                    ⚙
                </span>

                <span>
                    Réglages
                </span>

            </button>



            <!-- INTERNET -->

            <button
                class="phone-app"
                onclick="openModule('internet')"
            >

                <span class="app-icon">
                    ◎
                </span>

                <span>
                    Internet
                </span>

            </button>



            <!-- MUSIQUE -->

            <button
                class="phone-app"
                onclick="openModule('music')"
            >

                <span class="app-icon">
                    ♪
                </span>

                <span>
                    Musique
                </span>

            </button>



            <!-- STATISTIQUES -->

            <button
                class="phone-app"
                onclick="openModule('stats')"
            >

                <span class="app-icon">
                    ◌
                </span>

                <span>
                    Stats
                </span>

            </button>


        </main>



        <!-- ==================================================
             DOCK
             ================================================== -->

        <nav class="dock">


            <button
                onclick="openModule('phone')"
                aria-label="Téléphone"
            >
                ◉
            </button>


            <button
                onclick="openModule('browser')"
                aria-label="Navigateur"
            >
                ◎
            </button>


            <button
                onclick="openModule('messages')"
                aria-label="Messages"
            >
                ▱
            </button>


            <button
                onclick="openSettings()"
                aria-label="Réglages"
            >
                ⚙
            </button>


        </nav>


    </section>



    <!-- ==================================================
         RÉGLAGES
         ================================================== -->

    <section
        class="settings-screen"
        id="settingsScreen"
    >


        <header class="settings-header">


            <button
                class="back-button"
                onclick="closeSettings()"
            >
                ‹
            </button>


            <h1>
                Réglages
            </h1>


        </header>



        <main class="settings-content">


            <!-- APPARENCE -->

            <div class="settings-card">

                <div>

                    <div class="setting-title">
                        Apparence
                    </div>

                    <div class="setting-description">
                        Interface MyOS Fluid
                    </div>

                </div>

            </div>



            <!-- ANIMATIONS -->

            <div class="settings-card">


                <div>

                    <div class="setting-title">
                        Animations
                    </div>

                    <div class="setting-description">
                        Activer les animations de MyOS
                    </div>

                </div>



                <label class="switch">


                    <input
                        type="checkbox"
                        id="animationToggle"
                        checked
                        onchange="changeAnimations()"
                    >


                    <span class="slider"></span>


                </label>


            </div>



            <!-- SYSTÈME -->

            <div class="settings-card">


                <div>

                    <div class="setting-title">
                        Système
                    </div>

                    <div class="setting-description">
                        MyOS version 0.5
                    </div>

                </div>


            </div>


        </main>


    </section>



    <!-- ==================================================
         JAVASCRIPT MYOS
         ================================================== -->

    <script>


        /* =================================================
           ÉLÉMENTS
           ================================================= */


        const bootScreen =
            document.getElementById("bootScreen");


        const homeScreen =
            document.getElementById("homeScreen");


        const settingsScreen =
            document.getElementById(
                "settingsScreen"
            );


        const startButton =
            document.getElementById(
                "startButton"
            );



        /* =================================================
           HORLOGE
           ================================================= */


        function updateClock() {


            const now = new Date();


            const hours =
                String(now.getHours())
                .padStart(2, "0");


            const minutes =
                String(now.getMinutes())
                .padStart(2, "0");


            const time =
                hours + ":" + minutes;



            document.getElementById("clock")
                .textContent = time;


            document.getElementById("phoneTime")
                .textContent = time;


            document.getElementById("bigTime")
                .textContent = time;


        }


        updateClock();


        setInterval(
            updateClock,
            1000
        );



        /* =================================================
           DÉMARRAGE DE MYOS
           ================================================= */


        function startMyOS() {


            /*
             * Empêche plusieurs clics
             */

            startButton.disabled = true;


            /*
             * Empêche les interactions
             * avec l'ancien écran
             */

            bootScreen.style.pointerEvents =
                "none";


            /*
             * Prépare l'écran d'accueil
             */

            homeScreen.style.display =
                "block";


            /*
             * Lance son animation
             */

            homeScreen.classList.add(
                "home-enter"
            );


            /*
             * Lance l'animation de
             * disparition de l'ancien écran
             */

            bootScreen.classList.add(
                "boot-exit"
            );


            /*
             * Une fois l'animation terminée,
             * on supprime complètement
             * l'écran de démarrage.
             */

            setTimeout(function() {


                bootScreen.remove();


            }, 900);


        }



        /* =================================================
           OUVRIR LES RÉGLAGES
           ================================================= */


        function openSettings() {


            homeScreen.style.display =
                "none";


            settingsScreen.style.display =
                "block";


            settingsScreen.classList.remove(
                "screen-enter"
            );


            /*
             * Force le navigateur
             * à recalculer l'animation.
             */

            void settingsScreen.offsetWidth;


            settingsScreen.classList.add(
                "screen-enter"
            );


        }



        /* =================================================
           FERMER LES RÉGLAGES
           ================================================= */


        function closeSettings() {


            settingsScreen.style.display =
                "none";


            homeScreen.style.display =
                "block";


            homeScreen.classList.remove(
                "home-enter"
            );


        }



        /* =================================================
           RÉGLAGE DES ANIMATIONS
           ================================================= */


        function changeAnimations() {


            const toggle =
                document.getElementById(
                    "animationToggle"
                );


            const enabled =
                toggle.checked;


            /*
             * Sauvegarde le choix
             */

            localStorage.setItem(
                "myos_animations",
                enabled
            );


            /*
             * Active ou désactive
             * les animations
             */

            document.body.classList.toggle(
                "no-animations",
                !enabled
            );


        }



        /* =================================================
           CHARGEMENT DES PARAMÈTRES
           ================================================= */


        const savedAnimations =
            localStorage.getItem(
                "myos_animations"
            );


        if (
            savedAnimations !== null
        ) {


            const enabled =
                savedAnimations === "true";


            document.getElementById(
                "animationToggle"
            ).checked = enabled;


            document.body.classList.toggle(
                "no-animations",
                !enabled
            );


        }



        /* =================================================
           AUTRES MODULES
           ================================================= */


        function openModule(module) {


            alert(
                "MyOS\n\nModule : " + module
            );


        }


    </script>


</body>

</html>
