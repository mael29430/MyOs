<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MyOS</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ==================================================
         ÉCRAN DE DÉMARRAGE
         ================================================== -->

    <section
        class="boot-screen"
        id="bootScreen"
    >

        <div class="logo">
            MyOS
        </div>


        <h1 class="welcome">
            Bonjour 👋
        </h1>


        <p class="subtitle">
            Bienvenue sur votre système
        </p>


        <button
            class="start-button"
            onclick="startMyOS()"
        >
            Démarrer
        </button>


        <div
            class="clock"
            id="clock"
        >
            00:00
        </div>

    </section>



    <!-- ==================================================
         ÉCRAN D'ACCUEIL DU TÉLÉPHONE
         ================================================== -->

    <section
        class="home-screen"
        id="homeScreen"
    >


        <!-- BARRE D'ÉTAT -->

        <header class="status-bar">


            <div id="phoneTime">
                00:00
            </div>


            <div class="status-icons">
                📶 🔋
            </div>


        </header>



        <!-- ==================================================
             WIDGET PRINCIPAL
             ================================================== -->

        <section class="home-widget">


            <div
                class="widget-time"
                id="bigTime"
            >
                00:00
            </div>


            <div class="widget-date">
                Lundi 17 août
            </div>


            <div class="widget-weather">
                ☀️ 23°C
            </div>


        </section>



        <!-- ==================================================
             APPLICATIONS
             ================================================== -->

        <main class="phone-app-grid">


            <!-- CAMÉRA -->

            <button
                class="phone-app"
                onclick="openModule('camera')"
            >

                <span class="app-icon">
                    📷
                </span>

                <span>
                    Caméra
                </span>

            </button>



            <!-- SÉCURITÉ -->

            <button
                class="phone-app"
                onclick="openModule('security')"
            >

                <span class="app-icon">
                    🔐
                </span>

                <span>
                    Sécurité
                </span>

            </button>



            <!-- MODULES -->

            <button
                class="phone-app"
                onclick="openModule('modules')"
            >

                <span class="app-icon">
                    🧩
                </span>

                <span>
                    Modules
                </span>

            </button>



            <!-- FICHIERS -->

            <button
                class="phone-app"
                onclick="openModule('files')"
            >

                <span class="app-icon">
                    📁
                </span>

                <span>
                    Fichiers
                </span>

            </button>



            <!-- RÉGLAGES -->

            <button
                class="phone-app"
                onclick="openModule('settings')"
            >

                <span class="app-icon">
                    ⚙️
                </span>

                <span>
                    Réglages
                </span>

            </button>



            <!-- INTERNET -->

            <button
                class="phone-app"
                onclick="openModule('internet')"
            >

                <span class="app-icon">
                    🌐
                </span>

                <span>
                    Internet
                </span>

            </button>



            <!-- MUSIQUE -->

            <button
                class="phone-app"
                onclick="openModule('music')"
            >

                <span class="app-icon">
                    🎵
                </span>

                <span>
                    Musique
                </span>

            </button>



            <!-- STATISTIQUES -->

            <button
                class="phone-app"
                onclick="openModule('stats')"
            >

                <span class="app-icon">
                    📊
                </span>

                <span>
                    Stats
                </span>

            </button>


        </main>



        <!-- ==================================================
             DOCK DU TÉLÉPHONE
             ================================================== -->

        <nav class="dock">


            <button
                onclick="openModule('phone')"
                aria-label="Téléphone"
            >
                📞
            </button>


            <button
                onclick="openModule('browser')"
                aria-label="Navigateur"
            >
                🌐
            </button>


            <button
                onclick="openModule('messages')"
                aria-label="Messages"
            >
                💬
            </button>


            <button
                onclick="openModule('settings')"
                aria-label="Réglages"
            >
                ⚙️
            </button>


        </nav>


    </section>



    <!-- ==================================================
         JAVASCRIPT DE MYOS
         ================================================== -->

    <script>


        /* =================================================
           RÉCUPÉRATION DES ÉLÉMENTS
           ================================================= */


        const bootScreen =
            document.getElementById("bootScreen");


        const homeScreen =
            document.getElementById("homeScreen");



        /* =================================================
           HORLOGE
           ================================================= */


        function updateClock() {


            const now = new Date();


            const hours =
                String(now.getHours())
                .padStart(2, "0");


            const minutes =
                String(now.getMinutes())
                .padStart(2, "0");


            const currentTime =
                hours + ":" + minutes;



            /* Écran de démarrage */

            document.getElementById("clock")
                .textContent =
                currentTime;



            /* Barre du téléphone */

            document.getElementById("phoneTime")
                .textContent =
                currentTime;



            /* Grande horloge */

            document.getElementById("bigTime")
                .textContent =
                currentTime;


        }



        /* =================================================
           DÉMARRAGE DE MYOS
           ================================================= */


        function startMyOS() {


            /*
             * Lance l'animation
             * de disparition.
             */

            bootScreen.classList.add(
                "boot-exit"
            );



            /*
             * Attend la fin de
             * l'animation.
             */

            setTimeout(function() {


                /*
                 * Cache l'écran
                 * de démarrage.
                 */

                bootScreen.style.display =
                    "none";



                /*
                 * Affiche l'écran
                 * d'accueil.
                 */

                homeScreen.style.display =
                    "block";



                /*
                 * Lance l'animation
                 * d'arrivée.
                 */

                homeScreen.classList.add(
                    "home-enter"
                );


            }, 900);


        }



        /* =================================================
           OUVERTURE DES MODULES
           ================================================= */


        function openModule(module) {


            alert(
                "Module MyOS : " + module
            );


        }



        /* =================================================
           INITIALISATION
           ================================================= */


        updateClock();


        setInterval(
            updateClock,
            1000
        );


    </script>


</body>

</html>
