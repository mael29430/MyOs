name: Build MyOS

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer MyOS
        uses: actions/checkout@v4

      - name: Installer GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Compiler kernel.c
        run: |
          gcc -Wall -Wextra -c kernel/kernel.c -o kernel.o

      - name: Compiler boot.c
        run: |
          gcc -Wall -Wextra -c kernel/boot.c -o boot.o

      - name: Vérifier la compilation
        run: |
          echo "MYOS KERNEL BUILD"
          echo "Kernel : OK"
          echo "Boot : OK"
          echo "Compilation réussie !"
