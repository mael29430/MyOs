name: MyOS Build

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger MyOS
        uses: actions/checkout@v4

      - name: Installer les outils ARM64
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            qemu-system-aarch64

      - name: Compiler kernel.c
        run: |
          aarch64-linux-gnu-gcc \
            -ffreestanding \
            -nostdlib \
            -c kernel/kernel.c \
            -o kernel.o

      - name: Compiler console.c
        run: |
          aarch64-linux-gnu-gcc \
            -ffreestanding \
            -nostdlib \
            -c kernel/console.c \
            -o console.o

      - name: Compiler boot.c
        run: |
          aarch64-linux-gnu-gcc \
            -ffreestanding \
            -nostdlib \
            -c kernel/boot.c \
            -o boot.o

      - name: Compiler entry.S
        run: |
          aarch64-linux-gnu-as \
            kernel/entry.S \
            -o entry.o

      - name: Compiler mémoire
        run: |
          aarch64-linux-gnu-gcc \
            -ffreestanding \
            -nostdlib \
            -c system/memory/memory.c \
            -o memory.o

      - name: Compiler interruptions
        run: |
          aarch64-linux-gnu-gcc \
            -ffreestanding \
            -nostdlib \
            -c system/intrrupts/interrupt.c \
            -o interrupt.o

      - name: Compiler vecteurs ARM64
        run: |
          aarch64-linux-gnu-as \
            system/intrrupts/vectors.S \
            -o vectors.o

      - name: Compiler initialisation interruptions
        run: |
          aarch64-linux-gnu-as \
            system/intrrupts/interrupt_init.S \
            -o interrupt_init.o

      - name: Compiler timer
        run: |
          aarch64-linux-gnu-gcc \
            -ffreestanding \
            -nostdlib \
            -c system/timer/timer.c \
            -o timer.o

      - name: Compiler tâches
        run: |
          aarch64-linux-gnu-gcc \
            -ffreestanding \
            -nostdlib \
            -c system/tasks/task.c \
            -o task.o

      - name: Compiler contexte ARM64
        run: |
          aarch64-linux-gnu-as \
            system/tasks/context.S \
            -o context.o

      - name: Compiler périphériques
        run: |
          aarch64-linux-gnu-gcc \
            -ffreestanding \
            -nostdlib \
            -c system/devices/device.c \
            -o device.o

      - name: Compiler stockage
        run: |
          aarch64-linux-gnu-gcc \
            -ffreestanding \
            -nostdlib \
            -c system/storage/storage.c \
            -o storage.o

      - name: Compiler système de fichiers
        run: |
          aarch64-linux-gnu-gcc \
            -ffreestanding \
            -nostdlib \
            -c system/filesystem/filesystem.c \
            -o filesystem.o

      - name: Compiler syscalls
        run: |
          aarch64-linux-gnu-gcc \
            -ffreestanding \
            -nostdlib \
            -c system/syscall/syscall.c \
            -o syscall.o

      - name: Créer le kernel MyOS
        run: |
          aarch64-linux-gnu-ld \
            -T kernel/linker.ld \
            entry.o \
            boot.o \
            kernel.o \
            console.o \
            memory.o \
            interrupt.o \
            vectors.o \
            interrupt_init.o \
            timer.o \
            task.o \
            context.o \
            device.o \
            storage.o \
            filesystem.o \
            syscall.o \
            -o myos.elf

      - name: Vérifier les vecteurs ARM64
        run: |
          aarch64-linux-gnu-nm myos.elf | grep exception_vectors
          aarch64-linux-gnu-nm myos.elf | grep interrupt_vectors_init

      - name: Vérifier les fonctions de contexte
        run: |
          aarch64-linux-gnu-nm myos.elf | grep task_context_save
          aarch64-linux-gnu-nm myos.elf | grep task_context_restore

      - name: Vérifier le kernel
        run: |
          ls -lh myos.elf
          file myos.elf

      - name: Vérifier QEMU
        run: |
          qemu-system-aarch64 --version

      - name: Démarrer MyOS avec QEMU
        run: |
          timeout 5s qemu-system-aarch64 \
            -machine virt,gic-version=3 \
            -cpu cortex-a72 \
            -m 128M \
            -kernel myos.elf \
            -nographic \
            -serial mon:stdio || true

      - name: Résultat MyOS
        run: |
          echo "=============================="
          echo "        MYOS BUILD OK"
          echo "=============================="
          echo "Kernel : OK"
          echo "ARM64 vectors : OK"
          echo "Interrupt initialization : OK"
          echo "Context ARM64 : OK"
          echo "GIC : GICv3"
          echo "QEMU : OK"
          echo "=============================="
