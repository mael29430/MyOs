name: Build MyOS Kernel

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Télécharger MyOS
        uses: actions/checkout@v4


      - name: Installer les outils ARM64
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu


      - name: Compiler kernel.c
        run: |
          aarch64-linux-gnu-gcc \
          -ffreestanding \
          -nostdlib \
          -c kernel/kernel.c \
          -o kernel.o


      - name: Compiler console.c
        run: |
          aarch64-linux-gnu-gcc \
          -ffreestanding \
          -nostdlib \
          -c kernel/console.c \
          -o console.o


      - name: Compiler mémoire
        run: |
          aarch64-linux-gnu-gcc \
          -ffreestanding \
          -nostdlib \
          -c system/memory/memory.c \
          -o memory.o


      - name: Compiler stockage
        run: |
          aarch64-linux-gnu-gcc \
          -ffreestanding \
          -nostdlib \
          -c system/storage/storage.c \
          -o storage.o


      - name: Compiler tâches
        run: |
          aarch64-linux-gnu-gcc \
          -ffreestanding \
          -nostdlib \
          -c system/tasks/task.c \
          -o task.o


      - name: Compiler syscalls
        run: |
          aarch64-linux-gnu-gcc \
          -ffreestanding \
          -nostdlib \
          -c system/syscall/syscall.c \
          -o syscall.o


      - name: Compiler périphériques
        run: |
          aarch64-linux-gnu-gcc \
          -ffreestanding \
          -nostdlib \
          -c system/devices/device.c \
          -o device.o


      - name: Compiler boot.c
        run: |
          aarch64-linux-gnu-gcc \
          -ffreestanding \
          -nostdlib \
          -c kernel/boot.c \
          -o boot.o


      - name: Compiler entry.S
        run: |
          aarch64-linux-gnu-as \
          kernel/entry.S \
          -o entry.o


      - name: Vérification MyOS
        run: |
          echo "=============================="
          echo "        MYOS KERNEL"
          echo "=============================="
          echo ""
          echo "Kernel : OK"
          echo "Console : OK"
          echo "Memory : OK"
          echo "Storage : OK"
          echo "Tasks : OK"
          echo "Syscalls : OK"
          echo "Devices : OK"
          echo "Boot : OK"
          echo "Entry : OK"
          echo ""
          echo "Compilation terminée."
