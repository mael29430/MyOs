name: Build MyOS Kernel

on:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Télécharger MyOS
        uses: actions/checkout@v4


      - name: Installer les outils ARM64
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu


      - name: Compiler kernel.c
        run: |
          aarch64-linux-gnu-gcc \
          -ffreestanding \
          -nostdlib \
          -c kernel/kernel.c \
          -o kernel.o


      - name: Compiler console.c
        run: |
          aarch64-linux-gnu-gcc \
          -ffreestanding \
          -nostdlib \
          -c kernel/console.c \
          -o console.o


      - name: Compiler boot.c
        run: |
          aarch64-linux-gnu-gcc \
          -ffreestanding \
          -nostdlib \
          -c kernel/boot.c \
          -o boot.o


      - name: Compiler entry.S
        run: |
          aarch64-linux-gnu-as \
          kernel/entry.S \
          -o entry.o


      - name: Vérification MyOS
        run: |
          echo "=============================="
          echo "        MYOS KERNEL"
          echo "=============================="
          echo ""
          echo "Kernel : OK"
          echo "Console : OK"
          echo "Boot : OK"
          echo "Entry : OK"
          echo ""
          echo "Compilation terminée."
